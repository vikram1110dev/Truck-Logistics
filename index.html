<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in and Log-in</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            display: flex;
            gap: 40px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .form-box {
            background-color: white;
            border: 2px solid #333;
            padding: 25px;
            flex: 1;
        }
        
        .form-box h3 {
            color: #8a3f06;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 2px solid #333;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: rgb(161, 77, 16);
            color: white;
            border: 2px solid #333;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background-color: #8a3f06;
        }
        
        p {
            margin-top: 10px;
            color: #333;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body style="background-color: white; ">
    <h1 class="header">WELCOME!</h1>
    <div class="container">
        <div class="form-box" id="sign">
            <h3>Sign-up</h3>
            <label>Create Username:</label>
            <input type="text" placeholder="User name" id="uname">
            <label>Email id:</label>
            <input type="email" placeholder="E-mail id" id="eid">
            <label>Create Password:</label>
            <input type="password" placeholder="Password" id="pass">
            <label>Confirm Password:</label>
            <input type="password" placeholder="Confirm-password" id="pass1">
            <button onclick="create()">Create Account</button>
        </div>
        
        <div class="form-box" id="login">
            <h3>Log-in</h3>
            <label>Username:</label>
            <input type="text" placeholder="Username" id="logname">
            <label>Password:</label>
            <input type="password" placeholder="Password" id="logpass">
            <button onclick="login()">Log-in</button>
            <p id="test">...</p>
        </div>
    </div>

    <script>
        function create(){
            un=document.getElementById("uname").value;
            e=document.getElementById("eid").value;
            p=document.getElementById("pass").value;
            p1=document.getElementById("pass1").value;

            if(un==="")
            {
                alert("Please enter the user name")
            }
            else if(e=="")
            {
                alert("Please enter the email-id")
            }
            else if(p==="")
            {
                alert("Please enter the password")
            }
            else if(p1==="")
            {
                alert("Please enter the confirm password")
            }
            else if(p!=p1)
            {
                alert("confirm password is wrong")
            }
            else{
                alert("Account Created Successfully")
                localStorage.setItem("Name",un)
                localStorage.setItem("Email-id",e)
                localStorage.setItem("Password",p)
            }

            document.getElementById("uname").value="";
            document.getElementById("eid").value="";
            document.getElementById("pass").value="";
            document.getElementById("pass1").value="";
        }

        function login(){
            lu=document.getElementById("logname").value;
            lp=document.getElementById("logpass").value;

            username=localStorage.getItem("Name")
            password=localStorage.getItem("Password")

            if(lu===""){
                alert("Please enter the user name")
            }
            else if(lp===""){
                alert("Please enter the password")
            }
            else if(lu!=username)
            {
                alert("username or password not exist")
            }
            else if(lp!=password)
            {
                alert("username or password not exist")
            }
            else{
                alert("Login successfully!")
                window.location="./home.html"
            }
        }
    </script>    
</body>
</html>
