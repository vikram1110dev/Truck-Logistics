<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

    <body style="background-color: white; ">
    <h1 class="header">Booking</h1>
    <form style="text-align: left; padding-top: 30px; font-family: sans-serif; font-size: 20px; border:solid black 2px; width: 50%; margin: auto; padding: 20px; border-radius: 10px; background-color: #f9f9f9;">
        <fieldset>
            <legend style="font-weight: bold;">Fill out the form below to book a shipment:</legend><br><br>
            <div style="display: grid; grid-template-columns: auto auto;">
                <div>
            <label class="form-label" for="name">Name</label><br>
            <input style="border-radius: 10px;" class="form-input" type="text" id="n"><br><br></div>
            <div><label class="form-label" for="email">Email</label><br>
            <input style="border-radius: 10px;" class="form-input" type="email" id="e"><br><br></div>
            <div><label class="form-label" for="phone">Phone</label><br>
            <input style="border-radius: 10px;" class="form-input" type="tel" id="p"><br><br></div>
            <div><label class="form-label" for="pickup">Pickup Location</label><br>
            <input style="border-radius: 10px;" class="form-input" type="text" id="pickup"><br><br></div>
            <div><label class="form-label" for="dropoff">Drop-off Location</label><br>
            <input style="border-radius: 10px;" class="form-input" type="text" id="dropoff"><br><br></div></div>
            <button class="btn btn-primary" type="button" onclick="validate()">Book</button>
        </fieldset>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>

    <script>
        function validate(){
            nam=document.getElementById("n").value;
            email=document.getElementById("e").value;
            phone=document.getElementById("p").value;
            pickup=document.getElementById("pickup").value;
            dropoff=document.getElementById("dropoff").value;

            ni=/^[A-Za-z ]+$/;
            ei=/^[a-zA-Z0-9+_.-]+@[a-zA-Z0-9.-]+$/;
            pi=/^[0-9]{10}$/;
            pupp=/^[A-Za-z0-9 +/,_.-]+$/;
            doff=/^[A-Za-z0-9 +/,_.-]+$/;

        if(nam=="")
        {
            alert("Name is required")
        }
        else if(!ni.test(nam))
        {
            alert("Name should only contain letters")
        }
        else if(email=="")
        {
            alert("Email is required")
        }
        else if(!ei.test(email))
        {
            alert("Email should be in the correct format")
        }
        else if(phone=="")
        {
            alert("Phone number is required")
        }
        else if(!pi.test(phone))
        {
            alert("Phone number should be 10 digits long")
        }
        else if(pickup=="")
        {
            alert("Pickup location is required")
        }
        else if(!pupp.test(pickup))
        {
            alert("Pickup location should only contain letters and numbers")
        }
        else if(dropoff=="")
        {
            alert("Drop-off location is required")
        }
        else if(!doff.test(dropoff))
        {
            alert("Drop-off location should only contain letters and numbers")
        }
        else{
            alert("Name: " + nam + "\nEmail: " + email + "\nPhone: " + phone + "\nPickup: " + pickup + "\nDrop-off: " + dropoff + "\nForm submitted successfully")
        }

        }
    </script>

    
</body>
</html>
